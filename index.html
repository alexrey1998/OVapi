<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://livedepartures.org/">
<title>Live Departures</title>
<link rel="icon" type="image/svg+xml" href="https://livedepartures.org/icons/logo.svg">
<style>
  :root {
    --bg: #f2f4f7; --card: #ffffff; --text: #1d2129; --muted: #5b6372; --accent: #2d327d; --accent-text: #ffffff; --border: #dde1e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #181b21; --card: #22262e; --text: #e8eaee; --muted: #a0a7b4; --accent: #a5abe8; --accent-text: #181b21; --border: #343944; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  .logo { width: 56px; height: 56px; display: block; margin-bottom: 12px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin: 16px 0; }
  ol { margin: 0; padding-left: 1.3em; }
  li { margin: 4px 0; }
  b { font-weight: 600; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 600;
    background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 14px 16px; margin: 20px 0 8px;
  }
  details { border-top: 1px solid var(--border); padding: 10px 0; }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-weight: 600; }
  details ol { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="https://livedepartures.org/icons/logo.svg" alt="">
  <h1 id="title"></h1>
  <p id="lead"></p>
  <a class="btn" id="open" href="https://livedepartures.org/" target="_blank" rel="noopener"></a>

  <section class="card">
    <h2 id="install-title"></h2>
    <p class="muted" id="install-for"></p>
    <ol id="install-steps"></ol>
  </section>

  <section class="card">
    <h2 id="remove-title"></h2>
    <p id="remove-text"></p>
  </section>

  <section class="card">
    <h2 id="other-title"></h2>
    <div id="others"></div>
  </section>
</main>

<script>
  var SITE = "<b>livedepartures.org</b>";

  var T = {
    fr: {
      title: "Live Departures a déménagé",
      lead: "L'application est maintenant sur " + SITE + ". Cette ancienne version ne fonctionne plus : installez la nouvelle, c'est l'affaire d'une minute.",
      open: "Ouvrir livedepartures.org",
      installTitle: "Installer la nouvelle application",
      installFor: "Pour votre appareil ({name}) :",
      removeTitle: "Supprimer l'ancienne icône",
      removeText: "Une fois la nouvelle application installée, faites un appui long sur l'ancienne icône, puis choisissez « Supprimer » ou « Désinstaller ». Vos réglages (langue, thème, affichage) sont à refaire dans la nouvelle application. Si vous passiez par un favori, remplacez-le par livedepartures.org.",
      otherTitle: "Autre appareil ou navigateur",
      open1: "Ouvrez " + SITE + " dans {browser}.",
      g: {
        "android-chrome": ["Android · Chrome", ["Touchez le menu <b>⋮</b> en haut à droite.", "Touchez <b>Ajouter à l'écran d'accueil</b>, puis <b>Installer</b>."]],
        "android-firefox": ["Android · Firefox", ["Touchez le menu <b>⋮</b>.", "Touchez <b>Ajouter à l'écran d'accueil</b>, puis <b>Ajouter</b>."]],
        "android-samsung": ["Android · Samsung Internet", ["Touchez le menu <b>≡</b> en bas à droite.", "Touchez <b>Ajouter la page à</b>, puis <b>Écran d'accueil</b>."]],
        "android-edge": ["Android · Edge", ["Touchez le menu <b>···</b> en bas.", "Touchez <b>Ajouter au téléphone</b>, puis <b>Installer</b>."]],
        "ios-safari": ["iPhone / iPad · Safari", ["Touchez le bouton <b>Partager</b> (le carré avec une flèche ; il peut se trouver dans le menu <b>···</b>).", "Touchez <b>Sur l'écran d'accueil</b> (faites défiler si besoin), laissez <b>Ouvrir en tant qu'app web</b> activé, puis <b>Ajouter</b>."]],
        "ios-other": ["iPhone / iPad · Chrome, Firefox, Edge", ["Touchez le bouton <b>Partager</b> (dans la barre d'adresse ou le menu).", "Touchez <b>Sur l'écran d'accueil</b>, puis <b>Ajouter</b>."]],
        "desktop-chrome": ["Ordinateur · Chrome", ["Cliquez sur l'icône d'installation à droite de la barre d'adresse.", "Ou : menu <b>⋮</b> → <b>Caster, enregistrer et partager</b> → <b>Installer la page en tant qu'application</b>."]],
        "desktop-edge": ["Ordinateur · Edge", ["Cliquez sur l'icône d'installation à droite de la barre d'adresse.", "Ou : menu <b>···</b> → <b>Applications</b> → <b>Installer ce site en tant qu'application</b>."]],
        "desktop-safari": ["Mac · Safari", ["Menu <b>Fichier</b> → <b>Ajouter au Dock</b>."]],
        "desktop-firefox": ["Ordinateur · Firefox", ["Firefox n'installe pas les applications web sur ordinateur : ajoutez un marque-page (<b>Ctrl+D</b>, ou <b>⌘+D</b> sur Mac)."]]
      }
    },
    de: {
      title: "Live Departures ist umgezogen",
      lead: "Die App befindet sich jetzt unter " + SITE + ". Diese alte Version funktioniert nicht mehr: Installieren Sie die neue, das dauert nur eine Minute.",
      open: "livedepartures.org öffnen",
      installTitle: "Neue App installieren",
      installFor: "Für Ihr Gerät ({name}):",
      removeTitle: "Altes Symbol entfernen",
      removeText: "Sobald die neue App installiert ist, halten Sie das alte Symbol gedrückt und wählen Sie «Entfernen» oder «Deinstallieren». Ihre Einstellungen (Sprache, Design, Anzeige) müssen in der neuen App neu gesetzt werden. Falls Sie ein Lesezeichen verwendet haben, ersetzen Sie es durch livedepartures.org.",
      otherTitle: "Anderes Gerät oder anderer Browser",
      open1: "Öffnen Sie " + SITE + " in {browser}.",
      g: {
        "android-chrome": ["Android · Chrome", ["Tippen Sie oben rechts auf das Menü <b>⋮</b>.", "Tippen Sie auf <b>Zum Startbildschirm hinzufügen</b> und dann auf <b>Installieren</b>."]],
        "android-firefox": ["Android · Firefox", ["Tippen Sie auf das Menü <b>⋮</b>.", "Tippen Sie auf <b>Zum Startbildschirm hinzufügen</b> und dann auf <b>Hinzufügen</b>."]],
        "android-samsung": ["Android · Samsung Internet", ["Tippen Sie unten rechts auf das Menü <b>≡</b>.", "Tippen Sie auf <b>Seite hinzufügen zu</b> und dann auf <b>Startbildschirm</b>."]],
        "android-edge": ["Android · Edge", ["Tippen Sie unten auf das Menü <b>···</b>.", "Tippen Sie auf <b>Zum Telefon hinzufügen</b> und dann auf <b>Installieren</b>."]],
        "ios-safari": ["iPhone / iPad · Safari", ["Tippen Sie auf <b>Teilen</b> (das Quadrat mit dem Pfeil; eventuell im Menü <b>···</b>).", "Tippen Sie auf <b>Zum Home-Bildschirm</b> (ggf. nach unten scrollen), lassen Sie <b>Als Web-App öffnen</b> aktiviert und tippen Sie auf <b>Hinzufügen</b>."]],
        "ios-other": ["iPhone / iPad · Chrome, Firefox, Edge", ["Tippen Sie auf <b>Teilen</b> (in der Adressleiste oder im Menü).", "Tippen Sie auf <b>Zum Home-Bildschirm</b> und dann auf <b>Hinzufügen</b>."]],
        "desktop-chrome": ["Computer · Chrome", ["Klicken Sie auf das Installationssymbol rechts in der Adressleiste.", "Oder: Menü <b>⋮</b> → <b>Streamen, speichern und teilen</b> → <b>Seite als App installieren</b>."]],
        "desktop-edge": ["Computer · Edge", ["Klicken Sie auf das Installationssymbol rechts in der Adressleiste.", "Oder: Menü <b>···</b> → <b>Apps</b> → <b>Diese Website als App installieren</b>."]],
        "desktop-safari": ["Mac · Safari", ["Menü <b>Ablage</b> → <b>Zum Dock hinzufügen</b>."]],
        "desktop-firefox": ["Computer · Firefox", ["Firefox installiert auf dem Computer keine Web-Apps: Setzen Sie ein Lesezeichen (<b>Ctrl+D</b>, auf dem Mac <b>⌘+D</b>)."]]
      }
    },
    it: {
      title: "Live Departures ha traslocato",
      lead: "L'app si trova ora su " + SITE + ". Questa vecchia versione non funziona più: installate quella nuova, ci vuole un minuto.",
      open: "Apri livedepartures.org",
      installTitle: "Installare la nuova app",
      installFor: "Per il vostro dispositivo ({name}):",
      removeTitle: "Eliminare la vecchia icona",
      removeText: "Una volta installata la nuova app, tenete premuta la vecchia icona e scegliete «Rimuovi» o «Disinstalla». Le impostazioni (lingua, tema, visualizzazione) vanno reimpostate nella nuova app. Se usavate un segnalibro, sostituitelo con livedepartures.org.",
      otherTitle: "Altro dispositivo o browser",
      open1: "Aprite " + SITE + " in {browser}.",
      g: {
        "android-chrome": ["Android · Chrome", ["Toccate il menu <b>⋮</b> in alto a destra.", "Toccate <b>Aggiungi a schermata Home</b>, poi <b>Installa</b>."]],
        "android-firefox": ["Android · Firefox", ["Toccate il menu <b>⋮</b>.", "Toccate <b>Aggiungi a schermata principale</b>, poi <b>Aggiungi</b>."]],
        "android-samsung": ["Android · Samsung Internet", ["Toccate il menu <b>≡</b> in basso a destra.", "Toccate <b>Aggiungi pagina a</b>, poi <b>Schermata Home</b>."]],
        "android-edge": ["Android · Edge", ["Toccate il menu <b>···</b> in basso.", "Toccate <b>Aggiungi al telefono</b>, poi <b>Installa</b>."]],
        "ios-safari": ["iPhone / iPad · Safari", ["Toccate <b>Condividi</b> (il quadrato con la freccia; può trovarsi nel menu <b>···</b>).", "Toccate <b>Aggiungi alla schermata Home</b> (scorrete se necessario), lasciate attivo <b>Apri come app web</b>, poi <b>Aggiungi</b>."]],
        "ios-other": ["iPhone / iPad · Chrome, Firefox, Edge", ["Toccate <b>Condividi</b> (nella barra degli indirizzi o nel menu).", "Toccate <b>Aggiungi alla schermata Home</b>, poi <b>Aggiungi</b>."]],
        "desktop-chrome": ["Computer · Chrome", ["Cliccate sull'icona di installazione a destra della barra degli indirizzi.", "Oppure: menu <b>⋮</b> → <b>Trasmetti, salva e condividi</b> → <b>Installa pagina come app</b>."]],
        "desktop-edge": ["Computer · Edge", ["Cliccate sull'icona di installazione a destra della barra degli indirizzi.", "Oppure: menu <b>···</b> → <b>App</b> → <b>Installa questo sito come app</b>."]],
        "desktop-safari": ["Mac · Safari", ["Menu <b>File</b> → <b>Aggiungi al Dock</b>."]],
        "desktop-firefox": ["Computer · Firefox", ["Firefox non installa app web sul computer: aggiungete un segnalibro (<b>Ctrl+D</b>, o <b>⌘+D</b> su Mac)."]]
      }
    },
    en: {
      title: "Live Departures has moved",
      lead: "The app now lives at " + SITE + ". This old version no longer works: install the new one, it only takes a minute.",
      open: "Open livedepartures.org",
      installTitle: "Install the new app",
      installFor: "For your device ({name}):",
      removeTitle: "Remove the old icon",
      removeText: "Once the new app is installed, long-press the old icon and choose “Remove” or “Uninstall”. Your settings (language, theme, display) need to be set again in the new app. If you used a bookmark, replace it with livedepartures.org.",
      otherTitle: "Other device or browser",
      open1: "Open " + SITE + " in {browser}.",
      g: {
        "android-chrome": ["Android · Chrome", ["Tap the <b>⋮</b> menu at the top right.", "Tap <b>Add to Home screen</b>, then <b>Install</b>."]],
        "android-firefox": ["Android · Firefox", ["Tap the <b>⋮</b> menu.", "Tap <b>Add to Home screen</b>, then <b>Add</b>."]],
        "android-samsung": ["Android · Samsung Internet", ["Tap the <b>≡</b> menu at the bottom right.", "Tap <b>Add page to</b>, then <b>Home screen</b>."]],
        "android-edge": ["Android · Edge", ["Tap the <b>···</b> menu at the bottom.", "Tap <b>Add to phone</b>, then <b>Install</b>."]],
        "ios-safari": ["iPhone / iPad · Safari", ["Tap <b>Share</b> (the square with an arrow; it may be in the <b>···</b> menu).", "Tap <b>Add to Home Screen</b> (scroll if needed), keep <b>Open as Web App</b> on, then tap <b>Add</b>."]],
        "ios-other": ["iPhone / iPad · Chrome, Firefox, Edge", ["Tap <b>Share</b> (in the address bar or the menu).", "Tap <b>Add to Home Screen</b>, then <b>Add</b>."]],
        "desktop-chrome": ["Computer · Chrome", ["Click the install icon at the right of the address bar.", "Or: <b>⋮</b> menu → <b>Cast, save and share</b> → <b>Install page as app</b>."]],
        "desktop-edge": ["Computer · Edge", ["Click the install icon at the right of the address bar.", "Or: <b>···</b> menu → <b>Apps</b> → <b>Install this site as an app</b>."]],
        "desktop-safari": ["Mac · Safari", ["<b>File</b> menu → <b>Add to Dock</b>."]],
        "desktop-firefox": ["Computer · Firefox", ["Firefox does not install web apps on computers: add a bookmark (<b>Ctrl+D</b>, or <b>⌘+D</b> on Mac)."]]
      }
    }
  };

  // Browser named in the first step of each guide.
  var BROWSER = {
    "android-chrome": "Chrome", "android-firefox": "Firefox", "android-samsung": "Samsung Internet", "android-edge": "Edge",
    "ios-safari": "Safari", "ios-other": "Chrome / Firefox / Edge", "desktop-chrome": "Chrome", "desktop-edge": "Edge",
    "desktop-safari": "Safari", "desktop-firefox": "Firefox"
  };

  function pickLang() {
    var langs = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).slice(0, 2).toLowerCase();
      if (T[l]) return l;
    }
    return "en";
  }

  function detect() {
    var ua = navigator.userAgent;
    var ios = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (ios) return /CriOS|FxiOS|EdgiOS/.test(ua) ? "ios-other" : "ios-safari";
    if (/Android/.test(ua)) {
      if (/SamsungBrowser/.test(ua)) return "android-samsung";
      if (/Firefox/.test(ua)) return "android-firefox";
      if (/EdgA/.test(ua)) return "android-edge";
      return "android-chrome";
    }
    if (/Firefox/.test(ua)) return "desktop-firefox";
    if (/Edg\//.test(ua)) return "desktop-edge";
    if (/Chrome|Chromium/.test(ua)) return "desktop-chrome";
    if (/Safari/.test(ua)) return "desktop-safari";
    return "desktop-chrome";
  }

  function stepsHtml(t, key) {
    var steps = [t.open1.replace("{browser}", "<b>" + BROWSER[key] + "</b>")].concat(t.g[key][1]);
    return steps.map(function (s) { return "<li>" + s + "</li>"; }).join("");
  }

  var lang = pickLang();
  var t = T[lang];
  var mine = detect();
  document.documentElement.lang = lang;

  document.getElementById("title").textContent = t.title;
  document.getElementById("lead").innerHTML = t.lead;
  document.getElementById("open").textContent = t.open;
  document.getElementById("install-title").textContent = t.installTitle;
  document.getElementById("install-for").textContent = t.installFor.replace("{name}", t.g[mine][0]);
  document.getElementById("install-steps").innerHTML = stepsHtml(t, mine);
  document.getElementById("remove-title").textContent = t.removeTitle;
  document.getElementById("remove-text").textContent = t.removeText;
  document.getElementById("other-title").textContent = t.otherTitle;
  document.getElementById("others").innerHTML = Object.keys(t.g)
    .filter(function (k) { return k !== mine; })
    .map(function (k) { return "<details><summary>" + t.g[k][0] + "</summary><ol>" + stepsHtml(t, k) + "</ol></details>"; })
    .join("");
</script>
</body>
</html>
