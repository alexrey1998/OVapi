<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TP-Live</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#007bff">
<!-- After any code change, update both ?v= (date-time YYYY.MM.DD.HH.MM) and CACHE_VERSION in sw.js. -->
<link rel="stylesheet" href="style.css?v=2026.10.02.04.00">

<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" sizes="16x16" href="icons/icon-16.png">
</head>
<body>
<script>
  // Theme before first paint (avoids a light flash): cached mode, dark by default. theme.js checks afterwards.
  (function () {
    var mode = "dark";
    try {
      var c = JSON.parse(localStorage.getItem("theme.v1"));
      if (c && (c.mode === "light" || c.mode === "dark")) mode = c.mode;
    } catch (e) {}
    document.body.classList.add(mode + "-mode");
    if (mode === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#121417");
  })();
</script>

<h1 id="stop-name" contenteditable="true" spellcheck="false" data-placeholder="Entrez le nom de l'arrêt ici">Entrez le nom de l'arrêt ici</h1>

<button id="jump-back" type="button" class="hidden"></button>

<div id="status-banner" class="hidden" role="status" aria-live="polite"></div>

<div id="stop-suggestions"></div>

<div id="control-bar">
  <p id="last-update">
    <span><span data-i18n="updated">Màj :</span> <span id="update-time">-</span></span>
    <span id="quick-actions">
      <button id="btn-gps" data-i18n-label="gps" aria-label="Mettre à jour la position" title="Mettre à jour la position">📍</button>
      <button id="btn-refresh" data-i18n-label="refresh" aria-label="Recharger les départs" title="Recharger les départs">↻</button>
      <button id="btn-toggle-nearby" data-i18n-label="toggleNearby" aria-label="Basculer 1er/2e arrêt" title="Basculer 1er/2e arrêt">⇄</button>
      <button id="btn-toggle-display" data-i18n-label="toggleDisplay" aria-label="Changer mode d'affichage" title="Changer mode d'affichage">☰</button>
      <button id="btn-settings" data-i18n-label="settings" aria-label="Réglages" title="Réglages">⚙️</button>
    </span>
  </p>

  <button id="fullscreen-toggle" data-i18n="fullscreen">Plein écran ↗️</button>

  <div class="filter-container">
    <button id="toggle-filter" data-i18n="lineFilters">Filtres de lignes</button>
    <div id="line-filter-box" class="hidden"></div>
  </div>
</div>

<div id="settings-box" class="hidden"></div>

<div id="departures"></div>

<div id="thermo-container" class="hidden"></div>

<script>
  if ('serviceWorker' in navigator) {
    let _reloaded = false;
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_reloaded) return;
      _reloaded = true;
      location.reload();
    });
  }
</script>
<script type="module" src="script.js?v=2026.10.02.04.00"></script>
</body>
</html>
